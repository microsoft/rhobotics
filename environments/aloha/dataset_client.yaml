# Aloha dataset client configuration
# Maps server observation keys to LeRobot dataset keys
obs_mapping:
  joint_position: observations.joint_position
  cam_high: observations.images.cam_high
  cam_left_wrist: observations.images.cam_left_wrist
  cam_right_wrist: observations.images.cam_right_wrist
  task: task

gt_action_key: action.joint_position

# Joint names for plot labels (14 joints: 7 left + 7 right)
joint_names:
  - left_waist
  - left_shoulder
  - left_elbow
  - left_forearm_roll
  - left_wrist_angle
  - left_wrist_rotate
  - left_gripper
  - right_waist
  - right_shoulder
  - right_elbow
  - right_forearm_roll
  - right_wrist_angle
  - right_wrist_rotate
  - right_gripper
