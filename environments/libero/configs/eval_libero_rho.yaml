# Evaluate the released LIBERO policy, or an explicit checkpoint override.
pretrained_checkpoint: null
execution_horizon: 16

eval_num_episodes: 10
record_videos: true
output_dir: null
device: "cuda"

environment:
  type: "libero"
  task_suite_name: "libero_spatial"
  n_envs: 2
  max_episode_steps: 300

policy:
  type: "rho"
  pretrained_repo_id: "microsoft/rho-libero"

seed: 42
policy_seed: 42
