# Short validation: one episode for each of 10 tasks in every LIBERO suite.
pretrained_checkpoint: null
execution_horizon: 16
policy:
  type: "rho"
  pretrained_repo_id: "microsoft/rho-libero"

eval_num_episodes: 10
record_videos: false

eval_configs:
  - <<: !include eval_libero_rho.yaml
    execution_horizon: null
    name: "libero_spatial"
    eval_num_episodes: 10
    record_videos: false
    environment:
      type: "libero"
      episodes_per_task: 1
      task_suite_name: "libero_spatial"
      n_envs: 10
      max_episode_steps: 220
  - <<: !include eval_libero_rho.yaml
    execution_horizon: null
    name: "libero_object"
    eval_num_episodes: 10
    record_videos: false
    environment:
      type: "libero"
      episodes_per_task: 1
      task_suite_name: "libero_object"
      n_envs: 10
      max_episode_steps: 280
  - <<: !include eval_libero_rho.yaml
    execution_horizon: null
    name: "libero_goal"
    eval_num_episodes: 10
    record_videos: false
    environment:
      type: "libero"
      episodes_per_task: 1
      task_suite_name: "libero_goal"
      n_envs: 10
      max_episode_steps: 300
  - <<: !include eval_libero_rho.yaml
    execution_horizon: null
    name: "libero_10"
    eval_num_episodes: 10
    record_videos: false
    environment:
      type: "libero"
      task_suite_name: "libero_10"
      episodes_per_task: 1
      n_envs: 10
      max_episode_steps: 520
