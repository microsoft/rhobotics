# Train the Rho flow policy on LIBERO.
wandb:
  project: "rho"
  tags: ["libero", "rho", "training"]
  group: "libero_experiments"
  enabled: true

dataset: !include "libero_dataset.yaml"

environment: null

policy:
  type: "rho"
  resize_imgs_with_padding: null
  chunk_size: 16
  n_action_steps: 8
  # Published-recipe setting, also the Rho default; use 1 for lower-memory training.
  num_flow_samples: 8
  freeze_vlm_backbone: false
  freeze_vision_encoder: false
  freeze_language_model: false
  train_expert_only: false
  dropout_p: 0.02
  optimizer_lr: 1e-4
  lr_scheduler:
    type: "cosine_decay_with_warmup"
    peak_lr: 1e-4
    decay_lr: 5e-6
    num_decay_steps: 40000
    num_warmup_steps: 2500

# Canonical published-results topology: 4 GPUs x 32 samples/GPU = 128.
batch_size: 32
num_workers: 8
steps: 40000

output_dir: "outputs/training_rho"
save_checkpoint_every: 5000
keep_checkpoint_interval: 5000
logging_interval: 100
mixed_precision: "bf16"
gradient_accumulation_steps: 1
record_videos: false
eval_interval: 999999
validation_interval: 999999

resume: false
pretrained_checkpoint: null
