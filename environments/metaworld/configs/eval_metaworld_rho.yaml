# Evaluate a MetaWorld checkpoint. Works for both the finetuned policy and the
# same policy with a folded noise policy -- folding changes the checkpoint, not
# how it is evaluated.
pretrained_checkpoint: null

eval_num_episodes: 30
record_videos: false
output_dir: null
device: "cuda"

environment:
  type: "metaworld"
  task_id: 0  # assembly-v3; see mt50_tasks.json
  episodes_per_task: 30
  resolution: 256
  camera_name: "corner3"
  max_episode_steps: 200
  n_envs: 1

policy:
  type: "rho"

seed: 42
policy_seed: 42
