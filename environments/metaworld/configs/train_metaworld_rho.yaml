# Weakly finetune the Rho base policy on one MetaWorld task.
#
# Deliberately short: the point of the example is to leave headroom for online
# adaptation to close, not to saturate the task. 1k steps on 100 demos lands
# assembly-v3 around 0.6 success; 2k reaches 0.93 and 5k saturates at 1.00.
wandb:
  project: "rho"
  tags: ["metaworld", "rho", "training"]
  enabled: false

dataset: !include "metaworld_dataset.yaml"

environment: null

policy:
  type: "rho"
  resize_imgs_with_padding: null
  chunk_size: 16
  n_action_steps: 8
  num_flow_samples: 8
  freeze_vlm_backbone: false
  freeze_vision_encoder: false
  freeze_language_model: false
  train_expert_only: false
  dropout_p: 0.02
  optimizer_lr: 1e-4
  lr_scheduler:
    type: "cosine_decay_with_warmup"
    peak_lr: 1e-4
    decay_lr: 5e-6
    num_decay_steps: 1000
    num_warmup_steps: 100

batch_size: 32
num_workers: 8
steps: 1000

output_dir: "outputs/training_metaworld"
save_checkpoint_every: 500
keep_checkpoint_interval: 500
logging_interval: 100
mixed_precision: "bf16"
gradient_accumulation_steps: 1
