# Shared Rho training settings for RoboEval datasets.
wandb:
  project: "rho"
  tags: ["roboeval", "rho", "training"]
  group: "roboeval_experiments"
  enabled: false

policy:
  type: "rho"

batch_size: 4
num_workers: 4
learning_rate: 1e-4
steps: 100000

output_dir: "outputs/training_roboeval_rho"
save_checkpoint_every: 1000
keep_checkpoint_interval: 5000
logging_interval: 200
mixed_precision: "no"
gradient_accumulation_steps: 1

record_videos: true
eval_num_episodes: 2
eval_interval: 5000
eval_dataset_root_dir: "${HF_HOME}/datasets/microsoft/roboeval-data-for-rho/roboeval_combined"

resume: false
pretrained_checkpoint: null
