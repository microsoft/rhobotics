# Features for the RoboEval dual-arm setup
features:
  # Visual observations - camera feeds
  observation.image.0:
    type: VISUAL
    shape: (3,224,224) # RGB images
  observation.image.1:
    type: VISUAL
    shape: (3,224,224) # Left wrist camera
  observation.image.2:
    type: VISUAL
    shape: (3,224,224) # Right wrist camera

  # State observations - robot joint positions
  observation.state:
    type: STATE
    shape: (16,)

  # Actions - dual-arm joint positions
  action:
    type: ACTION
    shape: (16,) # 16 DOF: 8 joints per arm for dual ALOHA setup

<<: !include ../base/normalization_mapping.yaml

observation_mapping:
  "observation.images.head": "observation.image.0"
  "observation.images.left_wrist": "observation.image.1"
  "observation.images.right_wrist": "observation.image.2"
  # The language instruction may be missing from these datasets
  "observation.joint_position": "observation.state"
  "action.joint_position": "action"

transform_mapping:
  # "action":
  #   - type: delta_actions
  #     action_key: "action"
  #     state_key: "observation.state"
  #     action_type: "POSITION"
  #     relative_to_state: true
  #     post_norm: false

  "observation.image.0":
    - type: resize_with_padding
      height: 224
      width: 224

    - type: color_jitter
      brightness: 0.2
      contrast: [0.8, 1.2]
      saturation: [0.8, 1.2]
      hue: 0.05

  "observation.image.1":
    - type: resize_with_padding
      height: 224
      width: 224

    - type: color_jitter
      brightness: 0.2
      contrast: [0.8, 1.2]
      saturation: [0.8, 1.2]
      hue: 0.05

  "observation.image.2":
    - type: resize_with_padding
      height: 224
      width: 224

    - type: color_jitter
      brightness: 0.2
      contrast: [0.8, 1.2]
      saturation: [0.8, 1.2]
      hue: 0.05

action_type: POSITION  # Joint position control
