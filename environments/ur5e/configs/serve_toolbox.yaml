# UR5e bimanual toolbox vanilla policy server.
#
# Loads a phi5 toolbox checkpoint as the served policy. No HIL trainer, no
# experience streaming — just inference. The robot sends raw bimanual
# joint_positions; the env runs FK to produce ee_state (eef_quat_pos), which
# is then mapped to observation.state for the policy. Policy emits
# eef_quat_pos action chunks; the env passes them straight through.
#
# Source of truth on obs/action shapes:
#   environments/ur5e/configs/toolbox_0520/observation_mapping.yaml
#   environments/ur5e/configs/toolbox_0520/toolbox_train_features.yaml
#   environments/ur5e/configs/train_toolbox_phi5.yaml
#
# Run:
#   python environments/ur5e/serve_policy.py \
#     --config_path=environments/ur5e/configs/serve_toolbox.yaml \
#     --pretrained_checkpoint=/azuredata/msrx_results/training_ur5e_toolbox_phi5/<run>/checkpoints/<step>.pt

pretrained_checkpoint: "TODO_set_via_cli_or_edit_here.pt"

environment:
  type: "ur5e_server"
  port: 9999
  # Robot sends bimanual joint_positions; env FKs to eef_quat_pos internally
  # because policy_action_type is auto-set to EE_QUAT_POS_XYZW from the
  # checkpoint's data config (rho/server/serve_policy.py:195).
  input_action_type: "POSITION"
  output_action_type: "EE_QUAT_POS_XYZW"

policy_interface_cfg:
  observation_mapping:
    ee_state: observation.state
    zed_scene_bgr: observation.image.agentview
    zed_wrist_left_bgr: observation.image.left_wrist
    zed_wrist_right_bgr: observation.image.right_wrist
