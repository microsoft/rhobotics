# Training configuration for UR5e bimanual toolbox with the phi5 backbone.
# Usage:
#   accelerate launch environments/ur5e/train.py \
#     --config_path environments/ur5e/configs/train_toolbox_phi5.yaml

wandb:
  project: "rho_ur5e_toolbox_phi5"
  username: "msrx-eai"
  tags: ["toolbox", "ur5e", "bimanual", "phi5", "training"]
  group: "ur5e_toolbox_phi5_experiments"
  notes: "Phi5 training on UR5e bimanual toolbox dataset"
  enabled: false

dataset: !include "toolbox_0520/toolbox_train_dataset.yaml"
# validation_dataset: !include "toolbox_0520/toolbox_validation_dataset.yaml"

policy:
  type: "phi4mm"
  name: "phi4mm"
  # --- phi5 backbone selection ---
  vlm_backend: "phi5"
  vlm_backbone_folder: "/data/msrx-eai/models/phi-5-5B/Phi-4-vision-5B-frbxq/"
  # --- shared phi4mm/phi5 expert settings ---
  embed_dim: 1024
  num_heads: 16
  num_blocks: 16
  hidden_state_idx: 14
  n_obs_steps: 1
  chunk_size: 16
  n_action_steps: 8
  scheduler_decay_steps: 100000
  scheduler_warmup_steps: 5000
  # Defaults: train the action expert only. Launch-script sweeps override.
  freeze_vlm_backbone: False
  freeze_vision_encoder: False
  freeze_vision_transformer: False
  freeze_vision_projector: False
  freeze_language_model: True
  train_expert_only: False
  attention_type: "cross"
  norm: "adaptive"
  monkeypatch_siglip_encoder: False
  use_hd_transform: False
  # toolbox has no tactile -- disable the tactile head / history.
  tactile_mask: null
  tactile_encoder: "linear"
  use_tactile_head: False
  tactile_head_loss: "mse"
  tactile_loss_beta: 0.1
  combine_action_tactile_head: False
  baku_weight_init: False
  use_tactile_history: False
  max_tactile_dim: 38
  tactile_history_time: 2
  tactile_history_length: 10
  robot_hz: 18  # UR5e bimanual toolbox dataset is 18 fps (vs FR3 at 30)
  num_steps: 10


# Training parameters
batch_size: 4
num_workers: 4
learning_rate: 1e-4
steps: 50000

# Checkpoint and output settings
output_dir: "outputs/training_ur5e_toolbox_phi5"
save_checkpoint_every: 5000
keep_checkpoint_interval: 5000
logging_interval: 200
mixed_precision: "bf16"
gradient_accumulation_steps: 1
set_static_graph: True
log_level: "ERROR"
# Resume training settings
resume: false
pretrained_checkpoint: null
