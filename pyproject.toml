[project.urls]
homepage = "https://github.com/microsoft/phi-4-robotics"
issues = "https://github.com/microsoft/phi-4-robotics/issues"

[project]
name = "rho"
version = "0.1.0"
description = "🤖 Rho: Developmental Code Repo for the Rho family of Robotics foundation models"
authors = [{ name = "Microsoft Research", email = "msrresearch@microsoft.com" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["robotics", "deep learning", "pytorch", "rho", "phi-4", "multimodal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "cmake>=3.29.0.1",
    "datasets>=4.0.0,<4.2.0",
    "diffusers==0.34.0",
    "draccus==0.10.0",
    "einops>=0.8.0",
    "flask>=3.0.3",
    "gymnasium==1.1.1",
    "h5py>=3.10.0",
    "huggingface-hub[hf-transfer,cli]>=0.34.2,<0.36.0",
    "imageio[ffmpeg]==2.37.2",
    "lerobot @ git+https://github.com/huggingface/lerobot.git@5f15232271a81ee6be16cec1960e300f55f25466",
    "numba>=0.59.0",
    "omegaconf>=2.3.0",
    "numpy>=1.26.4",
    "opencv-python>=4.10.0.82",
    "opencv-python-headless>=4.10.0.82",
    "packaging>=24.2",
    "av>=14.2.0",
    "pymunk==6.11.1",
    "pyzmq>=26.2.1",                                                                                                                                                                                                             #Temporarily removing to resolve numpy conflict
    "torch>=2.8.0",
    "torchcodec==0.6.0; sys_platform != 'win32' and (sys_platform != 'linux' or (platform_machine != 'aarch64' and platform_machine != 'arm64' and platform_machine != 'armv7l')) and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
    "torchvision==0.23.0",
    "transformers==4.57.6",
    "wandb>=0.23.0",
    "scipy==1.15.3",
    "backoff>=2.1.0",
    "zarr>=2.17.0",
    "accelerate==1.10.0",
    "peft==0.17.0",
    "safetensors==0.5.3",
    "tqdm>=4.66.5",
    "pillow>=11.2.0",
    "roma>=1.5.4",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
pi0 = [
    "transformers==4.53.2",
    "sentencepiece>=0.2.0",
    "filelock>=3.16.1",
    "typing-extensions>=4.12.2",
]

server = ["rho-client @ file:rho_client", "aiohttp>=3.9.0"]

pusht = ["gym-pusht>=0.1.5 ; python_version < '4.0'"]

aloha_sim = ["gym_aloha>=0.1.1 ; python_version < '4.0'"]

test = ["pytest>=8.1.0", "pytest-cov>=5.0.0", "pyserial>=3.5"]

dev = ["pre-commit>=3.7.0", "debugpy>=1.8.1"]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [
    "tests/artifacts/**/*.safetensors",
    "lerobot/**",
    "notebooks/**",
    "__pycache__/**",
    ".pytest_cache/**",
    ".ruff_cache/**",
    "wandb/**",
    "rho/models/Phi-4-vision-5B/**",
    "rho/models/Phi-4-vision-reasoning-5B/**",
]

[tool.ruff.lint]
select = [
    "E4",   # Import errors
    "E7",   # Statement errors
    "E9",   # Runtime errors
    "F",    # Pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "E501", # Line too long
]

# Ignore specific rules to prevent removing Type imports
ignore = [
    # "F401",  # Unused imports
    "N812", # Lowercase imported as non-lowercase
    "N806", # Uppercase locals (idiomatic tensor dims: H, W, C, B, T)
    "N803", # Uppercase function args (idiomatic tensor dims)
    "N815", # Mixed-case class-scope vars (idiomatic tensor dims)
]

[tool.ruff.lint.isort]
known-first-party = ["rho"]
known-third-party = ["lerobot", "libero"]
lines-between-types = 0
force-single-line = false
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
# Ignore line length and other style issues in transformers_replace files (vendored from HuggingFace)
"rho/policies/pi0/transformers_replace/**/*.py" = ["E501", "E741", "F841", "SIM108", "E402", "I001"]
# Ignore line length in policy_visualizer (embedded HTML/JS string literals)
"rho/utils/policy_visualizer.py" = ["E501"]

[tool.bandit]
exclude_dirs = ["tests", "benchmarks", "lerobot", "wandb", "notebooks"]
skips = ["B101", "B106", "B107", "B108", "B110", "B113", "B301", "B403", "B311", "B404", "B603", "B608", "B614"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "-ra",
    "--cov=rho",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning:torch.*",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "gpu: marks tests that require GPU",
    "resource_intensive: marks tests that require significant resources",
    "env: marks tests that require specific environments",
]

[tool.coverage.run]
source = ["rho"]
omit = ["*/tests/*", "*/__pycache__/*", "*/.*", "setup.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.typos]
default.extend-ignore-re = [
    "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",
    "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on",
]
default.extend-ignore-identifiers-re = ["2nd", "pn", "ser", "ein"]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["rho*"]
