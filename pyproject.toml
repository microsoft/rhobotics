[project]
name = "rho"
version = "2026.9.20"
description = "Rho robotics foundation models for training, evaluation, and deployment"
authors = [{ name = "Microsoft Research" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["robotics", "deep learning", "pytorch", "rho", "multimodal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "accelerate==1.10.0",
    "datasets>=4.7.0,<5.0.0",
    "draccus==0.10.0",
    "einops>=0.8.0",
    "flask>=3.0.3",
    "gymnasium==1.1.1",
    "huggingface-hub>=1.0.0,<2.0.0",
    "imageio[ffmpeg]==2.37.2",
    "lerobot[dataset] @ git+https://github.com/huggingface/lerobot.git@87242cfced5228b6181fb0047021d684d424df38",
    "matplotlib>=3.8.0",
    "numpy>=1.26.4",
    "packaging>=24.2",
    "peft==0.18.0",
    "pillow>=11.2.0",
    "roma>=1.5.4",
    "safetensors>=0.8.0rc.0,<1.0.0",
    "torch>=2.8.0",
    "torchcodec==0.6.0; sys_platform != 'win32' and (sys_platform != 'linux' or (platform_machine != 'aarch64' and platform_machine != 'arm64' and platform_machine != 'armv7l')) and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
    "torchvision==0.23.0",
    "tqdm>=4.66.5",
    "transformers==5.5.0",
    "wandb>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/microsoft/rhobotics"
Issues = "https://github.com/microsoft/rhobotics/issues"

[project.optional-dependencies]
server = [
    "aiohttp>=3.9.0",
    "rho-client>=2026.9.20",
    "websockets>=14.0",
]
pusht = ["gym-pusht>=0.1.5"]
test = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "pyserial>=3.5",
]
dev = [
    "debugpy>=1.8.1",
    "ruff>=0.9.0",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["rho*"]

[tool.setuptools.package-data]
rho = [
    "models/Phi-4-vision-5B/chat_template.jinja",
    "models/Phi-4-vision-5B/config.json",
    "models/Phi-4-vision-5B/generation_config.json",
    "models/Phi-4-vision-5B/merges.txt",
    "models/Phi-4-vision-5B/modeling_bunny_phi4.py",
    "models/Phi-4-vision-5B/preprocessor_config.json",
    "models/Phi-4-vision-5B/processing_bunny_phi4.py",
    "models/Phi-4-vision-5B/special_tokens_map.json",
    "models/Phi-4-vision-5B/tokenizer_config.json",
    "models/Phi-4-vision-5B/vocab.json",
]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [
    "tests/artifacts/**/*.safetensors",
    "notebooks/**",
    "__pycache__/**",
    ".pytest_cache/**",
    ".ruff_cache/**",
    "wandb/**",
    "rho/models/Phi-4-vision-5B/**",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "N",
    "B",
    "C4",
    "SIM",
    "E501",
]
ignore = [
    "N812",
    "N806",
    "N803",
    "N815",
]

[tool.ruff.lint.isort]
known-first-party = ["rho"]
known-third-party = ["lerobot", "libero", "wandb"]
lines-between-types = 0
force-single-line = false
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"rho/utils/policy_visualizer.py" = ["E501"]

[tool.bandit]
exclude_dirs = ["tests", "notebooks"]
skips = ["B101", "B106", "B107", "B108", "B110", "B113", "B301", "B403", "B311", "B404", "B603", "B608", "B614"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "-ra",
    "--cov=rho",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning:torch.*",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "gpu: marks tests that require GPU",
    "resource_intensive: marks tests that require significant resources",
    "env: marks tests that require specific environments",
]

[tool.coverage.run]
source = ["rho"]
omit = ["*/tests/*", "*/__pycache__/*", "*/.*", "setup.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.typos]
default.extend-ignore-re = [
    "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",
    "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on",
]
default.extend-ignore-identifiers-re = ["2nd", "pn", "ser", "ein"]
