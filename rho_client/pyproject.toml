[project]
name = "rho-client"
version = "2026.9.20"
description = "Websocket client for Rho robot policies"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Microsoft Research" }]
requires-python = ">=3.10"
dependencies = [
    "msgpack>=1.0.5",
    "numpy>=1.22.4",
    "typing-extensions>=4.12.2",
    "websockets>=14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = ["pytest>=8.3.4"]

[tool.ruff]
line-length = 120
target-version = "py310"
